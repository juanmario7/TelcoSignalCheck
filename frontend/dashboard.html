<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - Señal</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f0f2f5; color: #1a1a2e; }

    header {
      background: #e4002b; color: #fff;
      padding: 16px 24px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    }
    header h1 { font-size: 18px; font-weight: 700; }
    header span { font-size: 13px; opacity: .8; margin-left: auto; }

    .toolbar {
      display: flex; align-items: center; gap: 12px; padding: 14px 24px;
      background: #fff; border-bottom: 1px solid #e5e7eb; flex-wrap: wrap;
    }
    .toolbar label { font-size: 13px; color: #444; font-weight: 500; }
    .toolbar input[type="date"] {
      padding: 7px 10px; border: 1.5px solid #ddd; border-radius: 8px;
      font-size: 14px; outline: none; cursor: pointer;
    }
    .toolbar input[type="date"]:focus { border-color: #e4002b; }
    .btn {
      padding: 8px 16px; border-radius: 8px; border: none; font-size: 14px;
      font-weight: 600; cursor: pointer; transition: background .2s;
    }
    .btn-primary { background: #e4002b; color: #fff; }
    .btn-primary:hover { background: #b8001f; }
    .btn-outline { background: #fff; color: #e4002b; border: 1.5px solid #e4002b; }
    .btn-outline:hover { background: #fde8ec; }
    .btn-clear { background: none; color: #888; border: 1.5px solid #ddd; }
    .btn-clear:hover { background: #f5f5f5; }

    .stats {
      display: flex; gap: 16px; padding: 20px 24px; flex-wrap: wrap;
    }
    .stat-card {
      background: #fff; border-radius: 12px; padding: 16px 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,.06); min-width: 140px;
    }
    .stat-card .value { font-size: 32px; font-weight: 700; color: #e4002b; }
    .stat-card .label { font-size: 13px; color: #666; margin-top: 2px; }

    .main { display: flex; gap: 0; height: calc(100vh - 220px); }

    #map { flex: 1; min-height: 400px; }

    .sidebar {
      width: 340px; background: #fff; overflow-y: auto;
      border-left: 1px solid #e5e7eb;
    }
    .sidebar h2 { padding: 16px; font-size: 15px; border-bottom: 1px solid #f0f0f0; position: sticky; top: 0; background: #fff; z-index: 10; }

    .report-item {
      padding: 12px 16px; border-bottom: 1px solid #f5f5f5; cursor: pointer;
      transition: background .15s;
    }
    .report-item:hover { background: #fff5f6; }
    .report-item .phone { font-weight: 600; font-size: 14px; }
    .report-item .addr { font-size: 12px; color: #666; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .report-item .meta { display: flex; gap: 8px; margin-top: 4px; font-size: 11px; color: #999; }
    .badge {
      padding: 2px 7px; border-radius: 20px; font-size: 11px; font-weight: 600;
    }
    .badge-gps { background: #d1fae5; color: #065f46; }
    .badge-address { background: #fde8ec; color: #e4002b; }

    @media (max-width: 640px) {
      .main { flex-direction: column; height: auto; }
      .sidebar { width: 100%; height: 300px; }
      #map { height: 350px; }
    }
  </style>
</head>
<body>
<header>
  <h1>📶 TelcoSignalCheck — Dashboard</h1>
  <span id="last-update"></span>
</header>

<div class="toolbar">
  <label>Desde</label>
  <input type="date" id="filter-from" />
  <label>Hasta</label>
  <input type="date" id="filter-to" />
  <button class="btn btn-primary" onclick="applyFilter()">Filtrar</button>
  <button class="btn btn-clear" onclick="clearFilter()">Limpiar</button>
  <button class="btn btn-outline" onclick="downloadCSV()">⬇ Descargar CSV</button>
</div>

<div class="stats">
  <div class="stat-card">
    <div class="value" id="stat-total">—</div>
    <div class="label">Reportes totales</div>
  </div>
  <div class="stat-card">
    <div class="value" id="stat-gps">—</div>
    <div class="label">Por GPS</div>
  </div>
  <div class="stat-card">
    <div class="value" id="stat-addr">—</div>
    <div class="label">Por dirección</div>
  </div>
</div>

<div class="main">
  <div id="map"></div>
  <div class="sidebar">
    <h2>Reportes recientes</h2>
    <div id="report-list"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // Mapa centrado en Colombia
  const map = L.map("map").setView([4.5709, -74.2973], 6);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "© OpenStreetMap contributors",
    maxZoom: 18,
  }).addTo(map);

  const markers = [];

  function formatDate(iso) {
    const d = new Date(iso + "Z");
    return d.toLocaleString("es-CO", { dateStyle: "short", timeStyle: "short" });
  }

  function flyTo(lat, lng) {
    map.flyTo([lat, lng], 15, { duration: 1 });
  }

  function getFilterParams() {
    const from = document.getElementById("filter-from").value;
    const to = document.getElementById("filter-to").value;
    const params = new URLSearchParams();
    if (from) params.set("date_from", from);
    if (to) params.set("date_to", to);
    return params.toString() ? "?" + params.toString() : "";
  }

  function applyFilter() { loadData(); }

  function clearFilter() {
    document.getElementById("filter-from").value = "";
    document.getElementById("filter-to").value = "";
    loadData();
  }

  function downloadCSV() {
    const qs = getFilterParams();
    window.location.href = "/api/reports/export" + qs;
  }

  async function loadData() {
    const qs = getFilterParams();
    const [reportsRes, statsRes] = await Promise.all([
      fetch("/api/reports" + qs),
      fetch("/api/stats" + qs),
    ]);
    const reports = await reportsRes.json();
    const stats = await statsRes.json();

    // Stats
    document.getElementById("stat-total").textContent = stats.total;
    const gpsCount = stats.by_method.find(m => m.location_method === "gps")?.count ?? 0;
    const addrCount = stats.by_method.find(m => m.location_method === "address")?.count ?? 0;
    document.getElementById("stat-gps").textContent = gpsCount;
    document.getElementById("stat-addr").textContent = addrCount;
    document.getElementById("last-update").textContent = "Actualizado: " + new Date().toLocaleTimeString("es-CO");

    // Limpiar markers viejos
    markers.forEach(m => map.removeLayer(m));
    markers.length = 0;

    // Pins en mapa
    reports.forEach(r => {
      if (r.lat && r.lng) {
        const color = r.location_method === "gps" ? "#065f46" : "#e4002b";
        const icon = L.divIcon({
          html: `<div style="width:12px;height:12px;border-radius:50%;background:${color};border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)"></div>`,
          className: "",
          iconSize: [12, 12],
          iconAnchor: [6, 6],
        });
        const marker = L.marker([r.lat, r.lng], { icon })
          .bindPopup(`
            <b>${r.phone}</b><br/>
            <small>${r.address || "Sin dirección"}</small><br/>
            ${r.description ? `<i>${r.description}</i><br/>` : ""}
            <small style="color:#999">${formatDate(r.created_at)}</small>
          `);
        marker.addTo(map);
        markers.push(marker);
      }
    });

    // Lista lateral
    const list = document.getElementById("report-list");
    list.innerHTML = reports.map(r => `
      <div class="report-item" onclick="flyTo(${r.lat}, ${r.lng})">
        <div class="phone">${r.phone}</div>
        <div class="addr">${r.address || "Ubicación GPS"}</div>
        <div class="meta">
          <span class="badge badge-${r.location_method}">${r.location_method === "gps" ? "GPS" : "Dirección"}</span>
          <span>${formatDate(r.created_at)}</span>
        </div>
        ${r.description ? `<div style="font-size:12px;color:#555;margin-top:4px">${r.description}</div>` : ""}
      </div>
    `).join("");
  }

  loadData();
  setInterval(loadData, 30000); // refresca cada 30s
</script>
</body>
</html>
